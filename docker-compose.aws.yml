services:
  api:
    image: ghcr.io/smarinb/devops-infra-api:latest
    container_name: api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.aws.conf:/etc/nginx/nginx.conf:ro
      - ./portfolio:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
